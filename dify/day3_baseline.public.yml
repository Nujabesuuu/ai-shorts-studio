    - data:
        code: "\nimport json\n\nWEIGHTS = {\n    \"traceability\": 25,\n    \"production_ready\": 25,\n    \"hook\": 20,\n    \"format_fit\":\
          \ 15,\n    \"uniqueness\": 15,\n}\nCRITERIA = list(WEIGHTS.keys())\n\n# Стеля 95. Вище — лише коли evidence містить дослівну цитату\
          \ з драфту.\n# Це прямий фікс інфляції оцінок: у попередньому прогоні критик поставив\n# 100/100/91/100, тобто рубрика не розрізняла\
          \ нічого.\nSOFT_CAP = 95\nMIN_EVIDENCE_FOR_TOP = 24\n\nREADY_AT = 85\nREVIEW_AT = 70\n\n\ndef _num(x, default=0.0):\n    try:\n    \
          \    return float(x)\n    except Exception:\n        return default\n\n\ndef _score_of(entry):\n    \"\"\"scores[criterion] може бути\
          \ {score, evidence} або просто числом.\"\"\"\n    if isinstance(entry, dict):\n        return _num(entry.get(\"score\")), str(entry.get(\"\
          evidence\") or \"\")\n    return _num(entry), \"\"\n\n\nMODEL_NAME = \"gemini-3.5-flash-lite\"\n\n\ndef main(items, project_id, run_id,\
          \ niche, platform, flow_version):\n    rows = []\n    per_criterion = {c: [] for c in CRITERIA}\n    totals = []\n    repaired_n = 0\n\
          \    warnings = []\n\n    for it in (items or []):\n        if not isinstance(it, dict):\n            continue\n        inner = it.get(\"\
          item\") if isinstance(it.get(\"item\"), dict) else it\n        raw = inner.get(\"scores\") or {}\n\n        quality = {}\n        weighted\
          \ = 0.0\n        for c in CRITERIA:\n            sc, ev = _score_of(raw.get(c))\n            sc = max(0.0, min(100.0, sc))\n       \
          \     if sc > SOFT_CAP and len(ev.strip()) < MIN_EVIDENCE_FOR_TOP:\n                sc = SOFT_CAP\n                warnings.append(\"\
          %s: бал вище %d без доказу — зрізано\"\n                                % (c, SOFT_CAP))\n            quality[c] = {\"score\": round(sc,\
          \ 2), \"evidence\": ev[:400]}\n            per_criterion[c].append(sc)\n            weighted += sc * WEIGHTS[c]\n\n        total = round(weighted\
          \ / 100.0, 2)\n        totals.append(total)\n\n        if total >= READY_AT:\n            status = \"ready\"\n        elif total >=\
          \ REVIEW_AT:\n            status = \"needs_review\"\n        else:\n            status = \"rejected\"\n\n        script = inner.get(\"\
          script\") or []\n        if not isinstance(script, list):\n            script = []\n        if not script:\n            warnings.append(\"\
          порожній script у «%s»\" % (inner.get(\"title\") or \"?\"))\n\n        tags = inner.get(\"hashtags\") or []\n        tags = [\"#\" +\
          \ str(t).lstrip(\"#\") for t in tags if str(t).strip()]\n\n        fmt = str(inner.get(\"format\") or \"reels\").lower()\n        if\
          \ fmt not in (\"reels\", \"carousel\", \"stories\"):\n            fmt = \"reels\"\n\n        dur = int(_num(inner.get(\"duration_sec\"\
          ), 0))\n        if dur and (dur < 3 or dur > 900):\n            dur = max(3, min(dur, 900))\n\n        if inner.get(\"repaired\"):\n\
          \            repaired_n += 1\n\n        row = {\n            \"project_id\": project_id or None,\n            \"topic_id\": inner.get(\"\
          topic_id\") or None,\n            \"source_trend_id\": inner.get(\"trend_id\") or None,\n            \"run_id\": run_id,\n         \
          \   \"niche\": niche,\n            \"platform\": platform,\n            \"format\": fmt,\n            \"title\": str(inner.get(\"title\"\
          ) or \"\")[:200],\n            \"hook\": inner.get(\"hook\") or None,\n            \"hook_alt\": inner.get(\"hook_alt\") or None,\n\
          \            \"script\": script,\n            \"onscreen_text\": inner.get(\"onscreen_text\") or None,\n            \"caption\": inner.get(\"\
          caption\") or None,\n            \"hashtags\": tags,\n            \"cta\": inner.get(\"cta\") or None,\n            \"duration_sec\"\
          : dur or None,\n            \"quality\": quality,\n            \"quality_score\": total,\n            \"repaired\": bool(inner.get(\"\
          repaired\")),\n            \"status\": status,\n            \"model\": MODEL_NAME,\n            \"flow_version\": flow_version,\n  \
          \      }\n        rows.append(row)\n\n    avg = round(sum(totals) / len(totals), 2) if totals else 0.0\n    by_crit = {c: round(sum(v)\
          \ / len(v), 2) if v else 0.0\n               for c, v in per_criterion.items()}\n\n    return {\n        \"rows_json\": json.dumps(rows,\
          \ ensure_ascii=False),\n        \"count\": len(rows),\n        \"gate\": \"ok\" if rows else \"empty\",\n        \"avg_score\": avg,\n\
          \        \"repaired_count\": repaired_n,\n        \"by_criterion\": json.dumps(by_crit, ensure_ascii=False),\n        \"warnings\":\
          \ \" · \".join(sorted(set(warnings))[:6]) or \"—\",\n    }\n"
