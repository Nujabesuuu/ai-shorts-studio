app:
  description: Читає затверджені теми Дня 2 (з відкатом на тренди Дня 1 і холодний старт), генерує готові до публікації одиниці контенту під reels/carousel/stories,
    незалежно оцінює їх за рубрикою з пʼяти критеріїв, точково лагодить лише те, що не пройшло поріг, зважує бали детерміністично і зберігає в
    day3_content з перевіркою факту запису.
  icon: 🎬
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: Day3 · Продакшн-контент (маршрутизація → продюсер → критик → точковий ремонт → day3_content)
  use_icon_as_answer_icon: false
