    - data:
        code: "\ndef _collect(src):\n    \"\"\"Розгортає обгортку {\"data\": [...]}, яку плагін іноді додає навколо рядків.\"\"\"\n    rows =\
          \ []\n    if isinstance(src, dict):\n        src = [src]\n    if not isinstance(src, list):\n        return rows\n    for el in src:\n\
          \        if not isinstance(el, dict):\n            continue\n        data = el.get(\"data\")\n        if isinstance(data, list):\n \
          \           rows.extend([r for r in data if isinstance(r, dict)])\n        elif isinstance(data, dict):\n            rows.append(data)\n\
          \        elif el:\n            rows.append(el)\n    return rows\n\n\ndef _rows(js, txt):\n    \"\"\"\n    Плагін Supabase віддає рядки\
          \ то як [{...}], то як [{\"data\":[...]}],\n    то лише текстом. Розбираємо всі три випадки — інакше флоу тихо\n    працює на порожньому\
          \ списку і ніхто цього не помічає.\n    \"\"\"\n    import json\n    rows = _collect(js)\n    if not rows and isinstance(txt, str) and\
          \ txt.strip().startswith((\"[\", \"{\")):\n        try:\n            rows = _collect(json.loads(txt))\n        except Exception:\n \
          \           rows = []\n    return rows\n\nimport json\n\n# Холодний старт: кути подачі, а не готовий контент. Наповнення все одно\n\
          # генерує модель під конкретну нішу — це лише каркас, щоб флоу не падав\n# на порожній базі.\nCOLD_ANGLES = [\n    {\"angle\": \"закулісся\
          \ процесу\", \"why\": \"показати те, чого клієнт не бачить\"},\n    {\"angle\": \"поширена помилка аудиторії\", \"why\": \"корисність\
          \ + впізнаваність\"},\n    {\"angle\": \"порівняння двох варіантів\", \"why\": \"готовий візуальний конфлікт\"},\n    {\"angle\": \"\
          історія одного клієнта\", \"why\": \"емоція і соціальний доказ\"},\n    {\"angle\": \"розбір ціни або складу\", \"why\": \"чесність\
          \ зчитується як довіра\"},\n]\n\n\ndef _clean(s, limit=400):\n    return str(s or \"\").strip()[:limit]\n\n\ndef main(topics_json, topics_text,\
          \ trends_json, trends_text,\n         content_json, content_text, niche, platform, formats, n_items):\n    topics = _rows(topics_json,\
          \ topics_text)\n    trends = _rows(trends_json, trends_text)\n    existing = _rows(content_json, content_text)\n\n    try:\n       \
          \ want = int(float(n_items))\n    except Exception:\n        want = 4\n    want = max(1, min(want, 12))\n\n    fmt_list = [f.strip().lower()\
          \ for f in str(formats or \"\").split(\",\") if f.strip()]\n    fmt_list = [f for f in fmt_list if f in (\"reels\", \"carousel\", \"\
          stories\")]\n    if not fmt_list:\n        fmt_list = [\"reels\", \"carousel\", \"stories\"]\n\n    # Антидубль: назви вже наявного\
          \ контенту + вже покриті теми/тренди.\n    banned = [str(r.get(\"title\") or \"\").strip() for r in existing if r.get(\"title\")]\n\
          \    used_topics = {str(r.get(\"topic_id\")) for r in existing if r.get(\"topic_id\")}\n    used_trends = {str(r.get(\"source_trend_id\"\
          )) for r in existing if r.get(\"source_trend_id\")}\n\n    briefs = []\n\n    # ── Джерело 1: затверджені теми Day 2 (основний шлях)\n\
          \    fresh_topics = [t for t in topics\n                    if str(t.get(\"id\")) not in used_topics\n                    and str(t.get(\"\
          status\") or \"approved\") in (\"approved\", \"ready\")]\n    source = \"\"\n    if fresh_topics:\n        source = \"day2_topics\"\n\
          \        for i, t in enumerate(fresh_topics[:want]):\n            briefs.append({\n                \"idx\": i,\n                \"source_kind\"\
          : \"day2_topics\",\n                \"topic_id\": str(t.get(\"id\")) if t.get(\"id\") else \"\",\n                \"trend_id\": str(t.get(\"\
          source_trend_id\")) if t.get(\"source_trend_id\") else \"\",\n                \"seed_title\": _clean(t.get(\"title\"), 140),\n     \
          \           \"seed_body\": _clean(t.get(\"text\")),\n                \"seed_hook\": \"\",\n                \"seed_format\": \"\",\n\
          \            })\n\n    # ── Джерело 2: тренди Day 1 (резерв, коли Day 2 ще не проходив)\n    if not briefs:\n        fresh_trends =\
          \ [t for t in trends if str(t.get(\"id\")) not in used_trends]\n        pool = fresh_trends or trends\n        if pool:\n          \
          \  source = \"day1_trends\"\n            for i, t in enumerate(pool[:want]):\n                briefs.append({\n                    \"\
          idx\": i,\n                    \"source_kind\": \"day1_trends\",\n                    \"topic_id\": \"\",\n                    \"trend_id\"\
          : str(t.get(\"id\")) if t.get(\"id\") else \"\",\n                    \"seed_title\": _clean(t.get(\"title\"), 140),\n             \
          \       \"seed_body\": _clean(t.get(\"description\")),\n                    \"seed_hook\": _clean(t.get(\"hook_idea\"), 200),\n    \
          \                \"seed_format\": _clean(t.get(\"format\"), 200),\n                })\n\n    # ── Джерело 3: холодний старт (ніші немає\
          \ в базі взагалі)\n    if not briefs:\n        source = \"cold_start\"\n        for i in range(want):\n            a = COLD_ANGLES[i\
          \ % len(COLD_ANGLES)]\n            briefs.append({\n                \"idx\": i,\n                \"source_kind\": \"cold_start\",\n\
          \                \"topic_id\": \"\",\n                \"trend_id\": \"\",\n                \"seed_title\": a[\"angle\"],\n         \
          \       \"seed_body\": a[\"why\"],\n                \"seed_hook\": \"\",\n                \"seed_format\": \"\",\n            })\n\n\
          \    # Формати роздаємо по колу — щоб один прогін давав різні типи публікацій,\n    # а не чотири однакові Reels.\n    for b in briefs:\n\
          \        b[\"format\"] = fmt_list[b[\"idx\"] % len(fmt_list)]\n        b[\"niche\"] = niche\n        b[\"platform\"] = platform\n  \
          \      b[\"banned_titles\"] = banned[:10]\n\n    notice = \"\"\n    if source == \"cold_start\":\n        notice = (\"У базі немає ні\
          \ тем Day 2, ні трендів Day 1 для цієї ніші — \"\n                  \"працюємо холодним стартом, привʼязки до джерела не буде.\")\n\
          \    elif source == \"day1_trends\":\n        notice = (\"Затверджених тем Day 2 для цієї ніші немає — \"\n                  \"спираємось\
          \ напряму на тренди Day 1.\")\n\n    return {\n        \"briefs\": briefs,\n        \"count\": len(briefs),\n        \"source\": source,\n\
          \        \"notice\": notice,\n        \"gate\": \"ok\" if briefs else \"empty\",\n        \"debug\": (\"topics=%d trends=%d existing=%d\
          \ -> briefs=%d src=%s\"\n                  % (len(topics), len(trends), len(existing), len(briefs), source)),\n    }\n"
        code_language: python3
        desc: Каскад джерел day2_topics → day1_trends → холодний старт, дедуп і роздача форматів.
