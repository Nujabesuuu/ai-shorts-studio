    - data:
        code: "\ndef _collect(src):\n    \"\"\"Розгортає обгортку {\"data\": [...]}, яку плагін іноді додає навколо рядків.\"\"\"\n    rows =\
          \ []\n    if isinstance(src, dict):\n        src = [src]\n    if not isinstance(src, list):\n        return rows\n    for el in src:\n\
          \        if not isinstance(el, dict):\n            continue\n        data = el.get(\"data\")\n        if isinstance(data, list):\n \
          \           rows.extend([r for r in data if isinstance(r, dict)])\n        elif isinstance(data, dict):\n            rows.append(data)\n\
          \        elif el:\n            rows.append(el)\n    return rows\n\n\ndef _rows(js, txt):\n    \"\"\"\n    Плагін Supabase віддає рядки\
          \ то як [{...}], то як [{\"data\":[...]}],\n    то лише текстом. Розбираємо всі три випадки — інакше флоу тихо\n    працює на порожньому\
          \ списку і ніхто цього не помічає.\n    \"\"\"\n    import json\n    rows = _collect(js)\n    if not rows and isinstance(txt, str) and\
          \ txt.strip().startswith((\"[\", \"{\")):\n        try:\n            rows = _collect(json.loads(txt))\n        except Exception:\n \
          \           rows = []\n    return rows\n\nimport json\n\n\ndef main(rows_json, rows_text, content_id):\n    rows = _rows(rows_json,\
          \ rows_text)\n    row = rows[0] if rows else {}\n\n    if not row.get(\"id\"):\n        return {\"gate\": \"empty\", \"note\": (\"Сценарію\
          \ з id=%s немає в day3_content. \"\n                \"Перевірте, що id скопійовано зі сторінки контенту в адмінці.\") % content_id,\n\
          \                \"title\": \"\", \"niche\": \"\", \"platform\": \"\", \"caption_seed\": \"\",\n                \"brief\": \"\", \"\
          kb_query\": \"\", \"cues_json\": \"[]\",\n                \"project_id\": \"\", \"duration\": 0}\n\n    script = row.get(\"script\"\
          ) or []\n    if isinstance(script, str):\n        try:\n            script = json.loads(script)\n        except Exception:\n       \
          \     script = []\n    frames = [f for f in script if isinstance(f, dict)]\n\n    title = str(row.get(\"title\") or \"\")\n    niche\
          \ = str(row.get(\"niche\") or \"\")\n    hook = str(row.get(\"hook\") or \"\")\n\n    # ── Розкладаємо кадри сценарію на 3 відеосегменти\
          \ по порядку.\n    n = 3\n    buckets = [[] for _ in range(n)]\n    if frames:\n        per = max(1, -(-len(frames) // n))         \
          \ # ceil\n        for i, f in enumerate(frames):\n            buckets[min(i // per, n - 1)].append(f)\n\n    seg_lines = []\n    for\
          \ i, b in enumerate(buckets):\n        parts = []\n        for f in b:\n            v = str(f.get(\"visual\") or \"\").strip()\n   \
          \         vo = str(f.get(\"voiceover\") or \"\").strip()\n            if v:\n                parts.append(v)\n            if vo:\n \
          \               parts.append(\"(голос: «%s»)\" % vo)\n        seg_lines.append(\"Сегмент %d: %s\" % (i + 1, \" · \".join(parts) or \"\
          за темою\"))\n\n    brief = \"\\n\".join([\n        \"Тема: %s\" % title,\n        \"Ніша: %s\" % niche,\n        \"Хук: %s\" % hook,\n\
          \        \"\",\n        \"\\n\".join(seg_lines),\n    ])\n\n    # ── Субтитри: перемапуємо войсовер у сітку 3×8 с.\n    # Таймінги оригіналу\
          \ можуть бути 15–45 с; фінальне відео — рівно 24 с,\n    # тому репліки кожного сегмента рівномірно ділять його 8 секунд.\n    cues\
          \ = []\n    for i, b in enumerate(buckets):\n        vos = [str(f.get(\"voiceover\") or \"\").strip() for f in b]\n        vos = [v\
          \ for v in vos if v]\n        if not vos:\n            continue\n        base = i * 8.0\n        step = 8.0 / len(vos)\n        for\
          \ j, text in enumerate(vos):\n            cues.append({\"start\": round(base + j * step, 2),\n                         \"end\": round(base\
          \ + (j + 1) * step - 0.05, 2),\n                         \"text\": text})\n\n    return {\n        \"gate\": \"ok\",\n        \"note\"\
          : \"\",\n        \"title\": title,\n        \"niche\": niche,\n        \"platform\": str(row.get(\"platform\") or \"instagram\"),\n\
          \        \"caption_seed\": str(row.get(\"caption\") or \"\"),\n        \"brief\": brief,\n        \"kb_query\": \"%s %s тон бренду візуальний\
          \ стиль палітра формат підписів\" % (niche, title),\n        \"cues_json\": json.dumps(cues, ensure_ascii=False),\n        \"project_id\"\
          : str(row.get(\"project_id\") or \"\"),\n        \"duration\": 24,\n    }\n"
