app:
  description: 'Продовження Day 3: бере готовий сценарій із day3_content, заземлює візуал і підпис на бренд-бук (RAG-перемикач для порівняння),
    генерує 4 межові кадри nano banana і 3 сегменти Veo 3.1 зі спільними кадрами на стиках, складає VTT-субтитри окремо від відео, ставить у чергу
    публікації і чекає затвердження людиною в адмінці.'
