          \        rich.append(\"<i>Бренд-буку бракувало: %s</i>\" % _esc(missing_bb))\n    plain.append(\"Затвердити: адмінка → Відео · Day 4\"\
          )\n    rich.append(\"Затвердити: адмінка → Відео · Day 4\")\n\n    payload = json.dumps({\"chat_id\": \"YOUR_TELEGRAM_CHAT_ID\", \"\
